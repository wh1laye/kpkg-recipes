name: release
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
      - name: Pack and sign
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -eu
          [ -n "$MINISIGN_KEY" ] || { echo "::error::secret MINISIGN_KEY is not set"; exit 1; }
          mkdir -p out
          tar --exclude=.git --exclude=out --transform 's,^\.,kpkg-recipes,' -czf out/kpkg-recipes.tar.gz .
          K=$(mktemp)
          trap 'rm -f "$K"' EXIT
          printf '%s\n' "$MINISIGN_KEY" | tr -d '\r' > "$K"
          head -n1 "$K" | grep -q '^untrusted comment:' || { echo "::error::MINISIGN_KEY must hold the whole secret key file, both lines"; exit 1; }
          if head -n1 "$K" | grep -qi 'encrypted' && [ -z "$MINISIGN_PASSWORD" ]; then
            echo "::error::the secret key is password protected but MINISIGN_PASSWORD is not set; generate the key with minisign -G -W or add the password secret"
            exit 1
          fi
          if [ -n "$MINISIGN_PASSWORD" ]; then
            printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$K" -m out/kpkg-recipes.tar.gz -x out/kpkg-recipes.tar.gz.minisig -t "kpkg-recipes" >/dev/null || { echo "::error::signing failed, wrong password or broken key"; exit 1; }
          else
            minisign -S -W -s "$K" -m out/kpkg-recipes.tar.gz -x out/kpkg-recipes.tar.gz.minisig -t "kpkg-recipes" >/dev/null || { echo "::error::signing failed, broken key"; exit 1; }
          fi
          [ -s out/kpkg-recipes.tar.gz.minisig ] || { echo "::error::signature was not created"; exit 1; }
      - name: Verify against kpkg-recipes.pub
        run: |
          set -eu
          minisign -V -p kpkg-recipes.pub -m out/kpkg-recipes.tar.gz -x out/kpkg-recipes.tar.gz.minisig >/dev/null || { echo "::error::the signature does not match kpkg-recipes.pub: MINISIGN_KEY is not the secret key of this public key"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view recipes-latest >/dev/null 2>&1 || gh release create recipes-latest --title "recipes-latest" --notes "Signed recipe tree used by kpkg sync"
          gh release upload recipes-latest out/kpkg-recipes.tar.gz out/kpkg-recipes.tar.gz.minisig --clobber
